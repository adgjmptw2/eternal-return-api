name: Python publish

# Push a tag like py-v0.1.0 whose version matches python/pyproject.toml.
# PyPI trusts this workflow (trusted publishing), so no token is needed.
on:
  push:
    tags: ['py-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Tag must match pyproject.toml
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "py-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - run: pip install build==1.2.2 twine==6.0.1
      - run: python -m build
      - run: twine check dist/*
      # Test what will be published, not the source tree.
      - run: pip install dist/*.whl pytest==8.3.4 mypy==1.14.1
      - run: pytest -q
      - run: mypy
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
